name: verify
on: [pull_request]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install nauty (genbg enumerates the cores)
        run: sudo apt-get install -y -q nauty || (sudo apt-get update -q && sudo apt-get install -y -q nauty)
      - name: Ledger lint (every PROVED/CERTIFIED/REFUTED row has an existing artifact)
        run: python tools/check_ledger.py
      - name: Committed certificates, re-checked without SAT
        run: |
          python tools/check_certs.py results/certs_5_6.json.gz --expect 5:9:15 6:10:211 6:11:25
          python tools/check_certs.py results/certs_7_13.json.gz --expect 7:13:37
      - name: Re-run the n <= 6 search from scratch
        working-directory: src
        run: python frontier.py 5 6
      - name: Fresh certificates, re-checked without SAT
        run: python tools/check_certs.py src/certs_5_6.json.gz --expect 5:9:15 6:10:211 6:11:25
      - name: Independent confirmation of the conjecture-A refutation
        working-directory: src
        run: python verify_fail.py
      - name: Construction LB certificates (every core with n <= 6, connected or not, every m), re-checked without SAT
        run: |
          python tools/check_certs.py results/certs_lb_2_6.json.gz --expect 2:3:1 2:4:1 3:3:1 3:4:2 3:5:3 3:6:1 \
            4:3:1 4:4:4 4:5:11 4:6:16 4:7:8 4:8:1 5:3:1 5:4:5 5:5:28 5:6:76 5:7:105 5:8:62 5:9:15 5:10:1 \
            6:3:1 6:4:8 6:5:66 6:6:317 6:7:781 6:8:1013 6:9:670 6:10:211 6:11:25 6:12:1
          python src/construct_run.py --check-cert=results/certs_lb_2_6.json.gz
          python src/construct_run.py --check-cert=results/certs_lb_disconnected_4_6.json.gz
      - name: Construction LB from scratch for n <= 5 (C and Python implementations must agree)
        working-directory: src
        run: for n in 2 3 4 5; do python construct_run.py $n --python=1 || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificates
          path: src/certs_*.json.gz
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan (the toolchain pinned in lean/lean-toolchain is fetched on first use)
        run: |
          [ -x "$HOME/.elan/bin/elan" ] || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit (core Lean only, no sorry, standard axioms only)
        run: lean/check.sh
