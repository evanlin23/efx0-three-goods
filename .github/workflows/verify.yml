name: verify
on: [pull_request]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install nauty (genbg enumerates the cores)
        run: sudo apt-get install -y -q nauty || (sudo apt-get update -q && sudo apt-get install -y -q nauty)
      - name: Ledger lint (every PROVED/CERTIFIED/REFUTED row has an existing artifact)
        run: python tools/check_ledger.py
      - name: Committed certificates, re-checked without SAT (all allocations within conjecture D)
        # certs_7_11 and certs_8_14 take minutes; their local re-checks are logged in results/check_certs_frontier.log
        run: |
          python tools/check_certs.py results/certs_5_6.json.gz --expect 5:9:15 6:10:211 6:11:25 --require-d
          python tools/check_certs.py results/certs_7_13.json.gz --expect 7:13:37 --require-d
          python tools/check_certs.py results/certs_7_12.json.gz --expect 7:12:541 --require-d
          python tools/check_certs.py results/certs_8_15.json.gz --expect 8:15:52 --require-d
          python tools/check_certs.py results/certs_small_m.json.gz --expect 2:3:1 2:4:1 3:3:1 3:4:2 3:5:3 3:6:1 4:3:1 4:4:4 4:5:11 4:6:16 4:7:8 5:3:1 5:4:5 5:5:28 5:6:76 5:7:105 5:8:62 6:3:1 6:4:8 6:5:66 6:6:317 6:7:781 6:8:1013 6:9:670 --require-d
          python tools/check_certs.py results/certs_c2_2_3_4.json.gz --require-d
          python tools/check_certs.py results/certs_beta3_3.json.gz --expect 3:4:2 --require-d
          python tools/check_certs.py results/certs_beta3_4.json.gz --expect 4:6:16 --require-d
          python tools/check_certs.py results/certs_beta3_5.json.gz --expect 5:8:62 --require-d
          python tools/check_certs.py results/certs_beta3_6.json.gz --expect 6:10:211 --require-d
          python tools/check_certs.py results/certs_beta3_7.json.gz --expect 7:12:541 --require-d
      - name: Q-plans for every reduced beta = 3 core (proofs/beta3.md, Lemma 7), re-checked independently
        run: python tools/check_qplans.py results/qplans_beta3.json.gz --expect 3:2 4:15 5:45 6:96 7:108 8:81 9:36 10:11
      - name: Committed certificates list every connected core (orbit counting, independent of nauty)
        # not certs_c2_2_3_4: it holds only the cores that have an allocation with all bundles <= 2
        run: |
          python tools/check_enum.py results/certs_5_6.json.gz results/certs_7_13.json.gz results/certs_7_12.json.gz \
            results/certs_7_11.json.gz results/certs_8_15.json.gz results/certs_8_14.json.gz results/certs_small_m.json.gz \
            results/certs_beta2_2.json.gz results/certs_beta2_3.json.gz results/certs_beta2_4.json.gz \
            results/certs_beta2_5.json.gz results/certs_beta2_6.json.gz results/certs_beta2_7.json.gz results/certs_beta2_8.json.gz \
            results/certs_beta3_3.json.gz results/certs_beta3_4.json.gz results/certs_beta3_5.json.gz \
            results/certs_beta3_6.json.gz results/certs_beta3_7.json.gz results/qplans_beta3.json.gz
      - name: Re-run the n <= 6 search from scratch
        working-directory: src
        run: python frontier.py 5 6
      - name: Fresh certificates, re-checked without SAT
        run: python tools/check_certs.py src/certs_5_6.json.gz --expect 5:9:15 6:10:211 6:11:25 --require-d
      - name: Independent confirmation of the conjecture-A refutation
        working-directory: src
        run: python verify_fail.py
      - name: Step 0 checks (conjecture-D shape of the committed certificates, X2 and X3 by brute force; smallest refutations and D for disconnected cores with n <= 6)
        working-directory: src
        run: |
          python step0_checks.py D X2 X3
          python c2_small.py
      - name: Construction LB certificates (every core with n <= 6, connected or not, every m), re-checked without SAT
        run: |
          python tools/check_certs.py results/certs_lb_2_6.json.gz --require-d --expect 2:3:1 2:4:1 3:3:1 3:4:2 3:5:3 3:6:1 \
            4:3:1 4:4:4 4:5:11 4:6:16 4:7:8 4:8:1 5:3:1 5:4:5 5:5:28 5:6:76 5:7:105 5:8:62 5:9:15 5:10:1 \
            6:3:1 6:4:8 6:5:66 6:6:317 6:7:781 6:8:1013 6:9:670 6:10:211 6:11:25 6:12:1
          python src/construct_run.py --check-cert=results/certs_lb_2_6.json.gz
          python src/construct_run.py --check-cert=results/certs_lb_disconnected_4_6.json.gz
      - name: Construction LB certificates for n = 7 (every connected core), orbit counts; full re-check of m <= 7
        # the other n = 7 LB certificates take 5-17 min each; re-checked locally in results/check_certs_lb_7.log
        run: |
          python tools/check_certs.py results/certs_lb_7_3_7.json.gz --require-d --expect 7:3:1 7:4:10 7:5:137 7:6:1097 7:7:4632
          python tools/check_enum.py results/certs_lb_7_3_7.json.gz results/certs_lb_7_8.json.gz results/certs_lb_7_9.json.gz \
            results/certs_lb_7_10.json.gz results/certs_lb_7_11_14.json.gz
      - name: Construction LB from scratch for n <= 5 (C and Python implementations must agree)
        working-directory: src
        run: for n in 2 3 4 5; do python construct_run.py $n --python=1 || exit 1; done
      - name: Minimal counterexample (proofs/min_counterexample.md) - reduction certificates, and the cores of T4
        # certs_min_cex_10_18 (about 10 min) and check_enum on cores_9_16_10_18 are re-checked locally:
        # results/check_certs_min_cex.log, results/check_enum_min_cex.log
        run: |
          python tools/check_reductions.py results/min_cex_reductions.json.gz --cover
          python tools/check_certs.py results/certs_min_cex_9_16.json.gz --expect 9:16:15 --require-d
          python tools/check_min_cex_cores.py results/cores_9_16_10_18.json.gz results/certs_min_cex_9_16.json.gz results/certs_min_cex_10_18.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificates
          path: src/certs_*.json.gz
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan (the toolchain pinned in lean/lean-toolchain is fetched on first use)
        run: |
          [ -x "$HOME/.elan/bin/elan" ] || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit (core Lean only, no sorry, standard axioms only)
        run: lean/check.sh
